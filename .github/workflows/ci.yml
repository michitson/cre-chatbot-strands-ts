name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci

      # The frontend imports amplify_outputs.json (gitignored — generated by
      # `ampx sandbox` per developer). Stub it so typecheck and the
      # production Next.js build can resolve the import against the real
      # shape without needing a live backend in CI.
      - name: Stub amplify_outputs.json
        run: |
          cat > amplify_outputs.json <<'EOF'
          {
            "version": "1.4",
            "auth": {
              "user_pool_id": "us-west-2_placeholder",
              "user_pool_client_id": "placeholder",
              "aws_region": "us-west-2",
              "identity_pool_id": "us-west-2:00000000-0000-0000-0000-000000000000",
              "username_attributes": ["email"],
              "standard_required_attributes": ["email"],
              "user_verification_types": ["email"],
              "unauthenticated_identities_enabled": false,
              "password_policy": {
                "min_length": 8,
                "require_lowercase": true,
                "require_numbers": true,
                "require_symbols": false,
                "require_uppercase": true
              }
            },
            "custom": {
              "chatHandlerUrl": "https://placeholder.invalid/",
              "bedrockModelId": "global.anthropic.claude-sonnet-4-6"
            }
          }
          EOF

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Next.js build
        run: npm run build
